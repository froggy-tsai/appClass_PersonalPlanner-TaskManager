.board-column.urgency-low>h2{background:#e2e4e5;color:#777b80}

padding:13px 15px 17px;border-top:1px solid var(--line);background:#fff;flex:none}.ai-assistant-input-wrap{border:1px solid #e5e6e0;border-radius:11px;padding:10px;background:#fff}.ai-assistant-input{display:block;width:100%;min-height:66px;resize:none;border:0;outline:none!important;font-size:12px;line-height:1.6;color:#555;background:transparent}.ai-assistant-input::placeholder{color:#a4a59e}.ai-assistant-compose-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.ai-assistant-compose-foot span{font-size:9px;color:#a1a29b}.ai-assistant-send{width:32px;height:32px;border:0;border-radius:8px;background:#343630;color:white;font-size:15px}.ai-assistant-send:disabled{opacity:.35;cursor:not-allowed}.app.ai-open .ai-assistant-toggle{opacity:0;pointer-events:none}@media(max-width:1000px){.ai-assistant-panel{width:370px}.app.ai-open .main{width:calc(100% - 244px - 370px)}.app.ai-open .sidebar.collapsed~.main{width:calc(100% - 68px - 370px)}.app.ai-open .page{padding-left:22px;padding-right:22px}.app.ai-open .columns{grid-template-columns:1fr}}@media(max-width:650px){.ai-assistant-toggle{right:16px;bottom:16px;height:46px}.ai-assistant-panel{width:100vw;max-width:100vw;z-index:60}.app.ai-open .main{visibility:hidden;width:100%}.app.ai-open .sidebar{visibility:hidden}.ai-assistant-head{height:60px;padding:0 15px}.ai-assistant-messages{padding:18px 14px}.ai-assistant-compose{padding:11px 12px 14px}}

<div class="app" id="plannerApp"><aside class="sidebar" id="sidebar" aria-label="主要導覽"><div class="brand"><span class="brand-mark" aria-hidden="true">▤</span><span class="brand-name">My Planner</span></div><div class="workspace">工作區</div><nav class="nav" id="navigation"><button class="nav-btn active" data-view="all"><span class="nav-icon">≡</span><span class="nav-label">全部項目</span></button><button class="nav-btn" data-view="calendar"><span class="nav-icon">▦</span><span class="nav-label">月曆</span></button><button class="nav-btn" data-view="tasks"><span class="nav-icon">☷</span><span class="nav-label">代辦事項(分類)</span><span class="nav-count" id="taskNavCount"></span></button></nav><div class="sidebar-bottom"><button class="nav-btn collapse-btn" id="collapseBtn" aria-label="收合側邊欄"><span class="nav-icon">‹</span><span class="collapse-text">收合側邊欄</span></button></div></aside><div class="drawer-scrim" id="drawerScrim"></div>
<main class="main"><header class="topbar"><button class="icon-btn mobile-menu" id="mobileMenu" aria-label="開啟導覽">☰</button><span class="crumb">My Planner</span><span class="crumb">/</span><strong class="crumb" id="crumbView">全部項目</strong><span class="top-spacer"></span><div class="auth-user" id="authUser"><span class="auth-header-error" id="authError" role="alert" aria-live="polite"></span><span class="auth-user-name" id="authUserName" hidden></span><button class="google-signin" id="googleSignInButton" type="button" disabled><span class="google-mark" aria-hidden="true">G</span><span id="googleSignInLabel">載入中</span></button><button class="auth-logout" id="signOutButton" type="button" hidden>登出</button></div></header><div class="page"><section class="greeting"><div><h1 id="greetingTitle"></h1><p id="greetingSubtitle"></p></div><div class="header-actions"><button class="btn" id="addScheduleTop">＋ 新增行程</button><button class="btn primary" id="addTaskTop">＋ 新增任務</button></div></section><div class="date-controls" id="dateControls"><button class="date-picker" id="prevDay" aria-label="前一天">‹</button><label class="date-label" for="datePicker">選擇日期</label><input class="date-picker" type="date" id="datePicker" aria-label="選擇日期"><button class="date-picker" id="nextDay" aria-label="後一天">›</button><button class="btn today-btn" id="todayBtn">今天</button></div><div class="toolbar" id="toolbar"><div class="search-wrap"><span aria-hidden="true">⌕</span><input type="search" id="searchInput" placeholder="搜尋行程、任務、地點⋯" aria-label="搜尋行程與任務"></div><select id="categoryFilter" aria-label="依分類篩選"><option value="">所有分類</option></select><button class="clear-btn" id="clearFilters">清除篩選</button></div><div id="content"></div></div></main><aside class="ai-assistant-panel" id="aiAssistantPanel" aria-label="AI 小幫手對話" aria-hidden="true"><header class="ai-assistant-head"><div class="ai-assistant-avatar" aria-hidden="true">✦</div><div class="ai-assistant-title"><strong>AI 小幫手</strong><span>Planner 助理 · 尚未連線</span></div><button class="ai-assistant-close" id="aiAssistantClose" type="button" aria-label="關閉 AI 小幫手">×</button></header><div class="ai-assistant-messages" id="aiAssistantMessages" aria-live="polite"><div class="ai-assistant-welcome"><div class="ai-assistant-avatar" aria-hidden="true">✦</div><div class="ai-assistant-bubble">嗨，我是 Planner AI 小幫手。連線完成後，我可以協助你整理行程、待辦事項，也能回答網站操作問題。</div></div><p class="ai-assistant-note">目前是介面預覽，AI 服務尚未連線。</p></div><form class="ai-assistant-compose" id="aiAssistantForm"><div class="ai-assistant-input-wrap"><textarea class="ai-assistant-input" id="aiAssistantInput" placeholder="AI 連線完成後，可在這裡輸入問題" aria-label="輸入訊息" disabled></textarea><div class="ai-assistant-compose-foot"><span>AI 回答可能不完全正確</span><button class="ai-assistant-send" type="submit" aria-label="傳送訊息" disabled>↑</button></div></div></form></aside><button class="ai-assistant-toggle" id="aiAssistantToggle" type="button" aria-controls="aiAssistantPanel" aria-expanded="false"><span class="ai-spark" aria-hidden="true">✦</span><span>AI 小幫手</span></button></div>
<div class="overlay" id="modalOverlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 id="modalTitle">新增</h2><p id="modalSubtitle"></p></div><button class="modal-close" id="modalClose" aria-label="關閉視窗">×</button></div><form id="itemForm" novalidate><div id="formFields"></div><div class="form-error" id="formError" role="alert"></div><div class="modal-foot"><button class="btn" type="button" id="cancelModal">取消</button><button class="btn primary" id="saveButton" type="submit">儲存</button></div></form></section></div>
<div class="overlay" id="categoryModalOverlay"><section class="modal category-modal" role="dialog" aria-modal="true" aria-labelledby="categoryModalTitle"><div class="modal-head"><div><h2 id="categoryModalTitle">新增分類</h2><p>建立容易辨識的待辦事項種類。</p></div><button class="modal-close" id="categoryModalClose" type="button" aria-label="關閉視窗">×</button></div><form id="categoryForm" novalidate><div class="field"><label for="categoryNameInput">分類名稱</label><input id="categoryNameInput" maxlength="40" autocomplete="off" placeholder="例如：課業、社團或生活"></div><div class="form-error" id="categoryFormError" role="alert"></div><div class="modal-foot"><button class="btn" type="button" id="categoryModalCancel">取消</button><button class="btn primary" type="submit" id="categoryModalSave">新增分類</button></div></form></section></div><div class="overlay" id="detailOverlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="modal-head"><div><h2 id="detailTitle">項目詳細資料</h2><p id="detailSubtitle"></p></div><button class="modal-close" id="detailClose" aria-label="關閉視窗">×</button></div><div id="detailBody"></div><div class="modal-foot"><button class="btn" id="detailEdit">編輯</button><button class="btn" id="detailCloseButton">關閉</button></div></section></div>
<div class="overlay" id="calendarDayOverlay"><section class="modal calendar-day-modal" role="dialog" aria-modal="true" aria-labelledby="calendarDayTitle"><div class="modal-head"><div><h2 id="calendarDayTitle">日期安排</h2><p id="calendarDaySubtitle"></p></div><button class="modal-close" id="calendarDayClose" aria-label="關閉視窗">×</button></div><div id="calendarDayBody"></div><div class="modal-foot"><button class="btn" id="calendarDayCloseButton">關閉</button></div></section></div><div class="overlay" id="confirmOverlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><div class="modal-head"><div><h2 id="confirmTitle"></h2><p id="confirmMessage"></p></div><button class="modal-close" id="confirmClose" aria-label="關閉視窗">×</button></div><div class="conflict-box" id="conflictInfo" hidden></div><div class="conflict-actions"><button class="btn" id="confirmCancel">返回修改</button><button class="btn primary" id="confirmAccept">繼續儲存</button></div></section></div><div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><button id="undoButton" hidden>Undo</button></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const categories=[{id:'cat-study',name:'課業',color:'#78947d'},{id:'cat-life',name:'生活',color:'#c39a69'},{id:'cat-club',name:'社團',color:'#8b83a5'},{id:'cat-other',name:'其他',color:'#8f9698'}];
const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const shiftDate=(date,days)=>{const d=new Date(`${date}T12:00:00`);d.setDate(d.getDate()+days);return localDate(d)};
const today=localDate(),tomorrow=shiftDate(today,1),now=Date.now();
let schedules=[{id:'s-1',title:'計算機網路課程',date:today,start:'09:00',end:'12:00',location:'工程五館 E2-101',note:'記得帶課堂講義。',categoryId:'cat-study',createdAt:now-80000,order:0},{id:'s-2',title:'小組專題討論',date:today,start:'14:00',end:'15:30',location:'管理二館討論室',note:'確認介面流程與分工進度。',categoryId:'cat-club',createdAt:now-60000,order:1},{id:'s-3',title:'圖書館自習',date:tomorrow,start:'16:00',end:'18:00',location:'總圖書館三樓',note:'預習下週課程內容。',categoryId:'cat-study',createdAt:now-40000,order:2},{id:'s-4',title:'資料庫系統課程',date:shiftDate(today,2),start:'10:00',end:'12:00',location:'管理二館 302',note:'攜帶筆電，課堂會操作 SQL。',categoryId:'cat-study',createdAt:now-20000,order:3},{id:'s-5',title:'社團例行會議',date:shiftDate(today,4),start:'18:30',end:'20:00',location:'活動中心 B1',note:'確認迎新活動流程與器材清單。',categoryId:'cat-club',createdAt:now-15000,order:4},{id:'s-6',title:'牙醫回診',date:shiftDate(today,7),start:'15:00',end:'15:30',location:'校外診所',note:'記得帶健保卡。',categoryId:'cat-life',createdAt:now-10000,order:5},{id:'s-7',title:'專題成果檢查',date:shiftDate(today,11),start:'13:00',end:'14:30',location:'工程五館 E2-101',note:'展示目前版本並確認待修項目。',categoryId:'cat-club',createdAt:now-5000,order:6}];
let tasks=[{id:'t-1',title:'完成編譯器作業',dueDate:today,status:'progress',priority:'high',categoryId:'cat-study',description:'整理詞法分析器的實作，完成測試案例。',createdAt:now-90000,order:0,plannedDates:[today],plannedOrderByDate:{[today]:0}},{id:'t-2',title:'整理作業系統筆記',dueDate:tomorrow,status:'todo',priority:'medium',categoryId:'cat-study',description:'整理記憶體管理與程序排程章節。',createdAt:now-70000,order:1},{id:'t-3',title:'準備專題簡報',dueDate:'',status:'progress',priority:'low',categoryId:'cat-club',description:'彙整目前專題成果，規劃簡報大綱。',createdAt:now-50000,order:2},{id:'t-4',title:'寄出專題進度給組員',dueDate:today,status:'todo',priority:'medium',categoryId:'cat-club',description:'整理本週完成內容與下週分工後寄給組員。',createdAt:now-42000,order:3,plannedDates:[today],plannedOrderByDate:{[today]:1}},{id:'t-5',title:'繳交資料庫小作業',dueDate:shiftDate(today,2),status:'todo',priority:'high',categoryId:'cat-study',description:'完成 SQL 查詢題並上傳課程平台。',createdAt:now-36000,order:4},{id:'t-6',title:'整理房間與回收',dueDate:shiftDate(today,4),status:'todo',priority:'low',categoryId:'cat-life',description:'整理書桌、分類紙類回收。',createdAt:now-30000,order:5},{id:'t-7',title:'預約下週讀書會教室',dueDate:shiftDate(today,6),status:'progress',priority:'medium',categoryId:'cat-life',description:'確認可借用時段並通知讀書會成員。',createdAt:now-24000,order:6},{id:'t-8',title:'準備期中考複習進度表',dueDate:shiftDate(today,9),status:'todo',priority:'low',categoryId:'cat-study',description:'依各科考試日期排定複習章節。',createdAt:now-18000,order:7},{id:'t-9',title:'完成社團活動海報初稿',dueDate:shiftDate(today,13),status:'progress',priority:'high',categoryId:'cat-club',description:'整理活動資訊並完成第一版視覺稿。',createdAt:now-12000,order:8},{id:'t-10',title:'採買日用品',dueDate:'',status:'todo',priority:'low',categoryId:'cat-life',description:'補充洗衣精、衛生紙與垃圾袋。',createdAt:now-6000,order:9}];
let state={view:'all',date:today,query:'',category:'',sortSchedule:'custom',sortTask:'custom',todayMode:'today',calendarMonth:today.slice(0,7)+'-01',calendarFilters:{plan:true,schedule:true,due:true},taskGroupMode:'priority',categoryEditingId:null,editing:null,detail:null,modalSnapshot:'',pendingConfirm:null,toastTimer:null,undo:null,drag:null};
const viewNames={all:'全部項目',calendar:'月曆',schedules:'行程',tasks:'代辦事項(分類)',categories:'分類'};
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(prefix){return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,9)}`}
function categoryName(id){return categories.find(c=>c.id===id)?.name||''}
function humanDate(date){return new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date(`${date}T12:00:00`))}
function matchesSearch(item,type){if(!state.query.trim())return true;const cat=categoryName(item.categoryId),fields=type==='schedule'?[item.title,item.location,item.note,cat,'行程','schedule']:[item.title,item.description,cat,item.status==='todo'?'To Do 待辦':'In Progress 進行中',item.priority==='high'?'緊急 急 High 高':item.priority==='medium'?'普通 Medium 中':'慢慢來 Low 低','任務'];const q=state.query.trim().toLocaleLowerCase();return fields.some(v=>String(v||'').toLocaleLowerCase().includes(q))}
function filteredSchedules(){return schedules.filter(s=>s.date===state.date&&(!state.category||s.categoryId===state.category)&&matchesSearch(s,'schedule'))}
function filteredTasks(){return tasks.filter(t=>(state.view==='all'||!t.dueDate||t.dueDate<=state.date)&&(!state.category||t.categoryId===state.category)&&matchesSearch(t,'task'))}
function sortItems(items,type){const mode=type==='schedule'?state.sortSchedule:state.sortTask;return [...items].sort((a,b)=>{if(mode==='custom')return a.order-b.order;if(type==='schedule'){if(mode==='time-asc')return a.start.localeCompare(b.start)||a.order-b.order;if(mode==='time-desc')return b.start.localeCompare(a.start)||a.order-b.order;if(mode==='created-asc')return a.createdAt-b.createdAt;if(mode==='created-desc')return b.createdAt-a.createdAt}else{if(mode==='due-asc'||mode==='due-desc'){if(!a.dueDate&&!b.dueDate)return a.order-b.order;if(!a.dueDate)return 1;if(!b.dueDate)return -1;return (mode==='due-asc'?1:-1)*a.dueDate.localeCompare(b.dueDate)||a.order-b.order}if(mode==='priority-desc'||mode==='priority-asc'){const r={high:0,medium:1,low:2};return (mode==='priority-desc'?1:-1)*(r[a.priority]-r[b.priority])||a.order-b.order}if(mode==='created-asc')return a.createdAt-b.createdAt;if(mode==='created-desc')return b.createdAt-a.createdAt}return a.order-b.order})}

(uid,name,items)=>{const ref=path(uid,name),existing=await dbSdk.getDocs(ref),wanted=new Map(items.map(item=>[String(item.id),item])),ops=[];for(const docSnap of existing.docs)if(!wanted.has(docSnap.id))ops.push(batch=>batch.delete(docSnap.ref));for(const [id,item] of wanted){const {id:_id,...data}=item;ops.push(batch=>batch.set(dbSdk.doc(ref,id),data))}for(let i=0;i<ops.length;i+=450){const batch=dbSdk.writeBatch(db);ops.slice(i,i+450).forEach(op=>op(batch));await batch.commit()}};window.plannerStore={load:async uid=>{const [tasks,schedules,categories]=await Promise.all(names.map(name=>readCollection(uid,name)));return {tasks,schedules,categories}},save:async(uid,data)=>{for(const name of names)await saveCollection(uid,name,data[name]||[])}};const setUser=user=>{const signedIn=Boolean(user);authUserName.hidden=!signedIn;authUserName.textContent=user?.displayName||user?.email||'';authUserName.title=user?.email||'';signInButton.hidden=signedIn;signOutButton.hidden=!signedIn;window.dispatchEvent(new CustomEvent('planner-auth-changed',{detail:{user:user||null}}))};authSdk.onAuthStateChanged(auth,setUser,error=>{errorBox.textContent=readableError(error)});signInButton.disabled=false;signInLabel.textContent='登入';signInButton.addEventListener('click',async()=>{signInButton.disabled=true;signInLabel.textContent='登入中…';errorBox.textContent='';try{await authSdk.signInWithPopup(auth,provider)}catch(error){errorBox.textContent=readableError(error)}finally{signInButton.disabled=false;signInLabel.textContent='登入'}});signOutButton.addEventListener('click',async()=>{signOutButton.disabled=true;try{await window.flushPlannerSave?.();await authSdk.signOut(auth)}catch(error){errorBox.textContent=readableError(error)}finally{signOutButton.disabled=false}})}catch(error){signInLabel.textContent='登入暫不可用';errorBox.textContent='無法載入 Firebase 服務，請確認網路連線後重新整理頁面。';setAiStatus('Firebase 載入失敗','請確認網路連線後重新整理頁面。',true);console.error('Firebase initialization failed',error)}
</script>
