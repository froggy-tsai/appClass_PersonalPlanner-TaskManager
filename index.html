tion:fixed;z-index:60;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#30312d;color:white;border-radius:8px;padding:10px 13px;display:flex;align-items:center;gap:12px;font-size:11px;box-shadow:var(--shadow);transition:opacity .18s,transform .18s;max-width:calc(100vw - 28px)}.toast.visible{opacity:1;transform:translate(-50%,0);pointer-events:auto}.toast button{border:0;background:transparent;color:#b9d7c1;font-size:11px;font-weight:650}.overlay{position:fixed;z-index:50;inset:0;background:#1f211f66;display:grid;place-items:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .16s,visibility .16s}.overlay.open{opacity:1;visibility:visible}.modal{width:min(510px,100%);max-height:min(88vh,780px);overflow:auto;background:white;border-radius:13px;box-shadow:var(--shadow);padding:22px}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:19px}.modal-head h2{font-size:17px;margin:0 0 4px}.modal-head p{font-size:11px;color:#898a83;margin:0}.modal-close{width:30px;height:30px;border:0;border-radius:6px;background:#f4f4f1;font-size:17px;color:#6a6b64}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:#60615a;font-weight:570}.field input,.field textarea,.field select{width:100%;border:1px solid #e5e5e0;border-radius:7px;background:white;padding:9px 10px;font-size:11px}.field textarea{min-height:80px;resize:vertical}.field input[aria-invalid=true]{border-color:#c76a5b}.form-error{font-size:10px;color:#b24f43}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:19px;padding-top:14px;border-top:1px solid var(--line)}.detail-block{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}.detail-label{font-size:10px;color:#8a8b83;margin-bottom:5px}.detail-text{white-space:pre-wrap;font-size:12px;line-height:1.7;overflow-wrap:anywhere}.conflict-box{backg <div class="app"><aside class="sidebar" id="sidebar" aria-label="主要導覽"><div class="brand"><span class="brand-mark" aria-hidden="true">▤</span><span class="brand-name">My Planner</span></div><div class="workspace">WORKSPACE</div><nav class="nav" id="navigation"><button class="nav-btn active" data-view="dashboard"><span class="nav-icon">⌂</span><span class="nav-label">Dashboard</span></button><button class="nav-btn" data-view="today"><span class="nav-icon">◷</span><span class="nav-label">Today</span></button><button class="nav-btn" data-view="all"><span class="nav-icon">▦</span><span class="nav-label">All Items</span></button><button class="nav-btn" data-view="schedules"><span class="nav-icon">▣</span><span class="nav-label">Schedules</span><span class="nav-count" id="scheduleNavCount"></span></button><button class="nav-btn" data-view="tasks"><span class="nav-icon">☷</span><span class="nav-label">Tasks</span><span class="nav-count" id="taskNavCount"></span></button><button class="nav-btn" data-view="categories"><span class="nav-icon">◈</span><span class="nav-label">Categories</span></button></nav><div class="sidebar-bottom"><button class="nav-btn collapse-btn" id="collapseBtn" aria-label="收合側邊欄"><span class="nav-icon">‹</span><span class="collapse-text">收合側邊欄</span></button></div></aside><div class="drawer-scrim" id="drawerScrim"></div>
<main class="main"><header class="topbar"><button class="icon-btn mobile-menu" id="mobileMenu" aria-label="開啟導覽">☰</button><span class="crumb">My Planner</span><span class="crumb">/</span><strong class="crumb" id="crumbView">Dashboard</strong><span class="top-spacer"></span><button class="icon-btn" id="quickAdd" aria-label="新增任務" title="新增任務">＋</button></header><div class="page"><section class="greeting"><div><div class="eyebrow" id="dateEyebrow">PERSONAL PLANNER</div><h1 id="greetingTitle"></h1><p id="greetingSubtitle"></p></div><div class="header-actions"><button class="btn" id="addScheduleTop">＋ Add Schedule</button><button class="btn primary" id="addTaskTop">＋ Add Task</button><button class="btn all-btn" id="allItemsBtn">All Items</button></div></section><div class="date-controls" id="dateControls"><button class="date-picker" id="prevDay" aria-label="前一天">‹</button><label class="date-label" for="datePicker">選擇日期</label><input class="date-picker" type="date" id="datePicker" aria-label="選擇日期"><button class="date-picker" id="nextDay" aria-label="後一天">›</button><button class="btn today-btn" id="todayBtn">Today</button></div><section id="dashboardStats"><div class="overview"><article class="stat"><div class="stat-head"><span>Total Tasks</span><span class="stat-icon">☷</span></div><div class="stat-number" id="totalStat">0</div><div class="stat-foot">目前篩選範圍內</div></article><article class="stat"><div class="stat-head"><span>To Do</span><span class="stat-icon">○</span></div><div class="stat-number" id="todoStat">0</div><div class="stat-foot">尚待開始</div></article><article class="stat"><div class="stat-head"><span>In Progress</span><span class="stat-icon">◷</span></div><div class="stat-number" id="progressStat">0</div><div class="stat-foot">正在處理中</div></article></div><article class="progress-card"><div class="progress-top"><span>Task Progress <span style="color:#999;font-weight:400">／任務處理進度</span></span><span id="progressPercent">0%</span></div><div class="progress-track" role="progressbar" aria-label="已開始處理的任務比例" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div><div class="progress-note">進行中任務 ÷ 目前顯示的任務總數；代表已開始處理的比例，並非完成率。</div></article></section><div class="toolbar" id="toolbar"><div class="search-wrap"><span aria-hidden="true">⌕</span><input type="search" id="searchInput" placeholder="搜尋行程、任務、地點⋯" aria-label="搜尋行程與任務"></div><select id="categoryFilter" aria-label="依分類篩選"><option value="">所有分類</option></select><select id="statusFilter" aria-label="依任務狀態篩選"><option value="">所有狀態</option><option value="todo">To Do</option><option value="progress">In Progress</option></select><button class="clear-btn" id="clearFilters">清除篩選</button></div><div id="content"></div></div></main></div>
<div class="overlay" id="modalOverlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 id="modalTitle">新增</h2><p id="modalSubtitle"></p></div><button class="modal-close" id="modalClose" aria-label="關閉視窗">×</button></div><form id="itemForm" novalidate><div id="formFields"></div><div class="form-error" id="formError" role="alert"></div><div class="modal-foot"><button class="btn" type="button" id="cancelModal">取消</button><button class="btn primary" id="saveButton" type="submit">儲存</button></div></form></section></div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const categories=[{id:'cat-study',name:'課業',color:'#78947d'},{id:'cat-life',name:'生活',color:'#c39a69'},{id:'cat-club',name:'社團',color:'#8b83a5'},{id:'cat-other',name:'其他',color:'#8f9698'}];
const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const shiftDate=(date,days)=>{const d=new Date(`${date}T12:00:00`);d.setDate(d.getDate()+days);return localDate(d)};
const today=localDate(),tomorrow=shiftDate(today,1),now=Date.now();
let schedules=[{id:'s-1',title:'計算機網路課程',date:today,start:'09:00',end:'12:00',location:'工程五館 E2-101',note:'記得帶課堂講義。',categoryId:'cat-study',createdAt:now-80000,order:0},{id:'s-2',title:'小組專題討論',date:today,start:'14:00',end:'15:30',location:'管理二館討論室',note:'確認介面流程與分工進度。',categoryId:'cat-club',createdAt:now-60000,order:1},{id:'s-3',title:'圖書館自習',date:tomorrow,start:'16:00',end:'18:00',location:'總圖書館三樓',note:'預習下週課程內容。',categoryId:'cat-study',createdAt:now-40000,order:2}];
let tasks=[{id:'t-1',title:'完成編譯器作業',dueDate:today,status:'progress',priority:'high',categoryId:'cat-study',description:'整理詞法分析器的實作，完成測試案例。',createdAt:now-90000,order:0},{id:'t-2',title:'整理作業系統筆記',dueDate:tomorrow,status:'todo',priority:'medium',categoryId:'cat-study',description:'整理記憶體管理與程序排程章節。',createdAt:now-70000,order:1},{id:'t-3',title:'準備專題簡報',dueDate:'',status:'progress',priority:'low',categoryId:'cat-club',description:'彙整目前專題成果，規劃簡報大綱。',createdAt:now-50000,order:2}];
let state={view:'dashboard',date:today,query:'',category:'',status:'',sortSchedule:'custom',sortTask:'custom',editing:null,detail:null,modalSnapshot:'',pendingConfirm:null,toastTimer:null,undo:null,drag:null};
const viewNames={dashboard:'Dashboard',today:'Today',all:'All Items',schedules:'Schedules',tasks:'Tasks',categories:'Categories'};
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(prefix){return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,9)}`}
function categoryName(id){return categories.find(c=>c.id===id)?.name||''}
function humanDate(date){return new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date(`${date}T12:00:00`))}
function matchesSearch(item,type){if(!state.query.trim())return true;const cat=categoryName(item.categoryId),fields=type==='schedule'?[item.title,item.location,item.note,cat,'行程','schedule']:[item.title,item.description,cat,item.status==='todo'?'To Do 待辦':'In Progress 進行中',item.priority==='high'?'High 高':item.priority==='medium'?'Medium 中':'Low 低','任務'];const q=state.query.trim().toLocaleLowerCase();return fields.some(v=>String(v||'').toLocaleLowerCase().includes(q))}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#confirmOverlay').classList.contains('open')){closeConfirm();if(state.editing?.type==='schedule')$('#modalOverlay').classList.add('open')}else if($('#modalOverlay').classList.contains('open'))closeModal();else if($('#detailOverlay').classList.contains('open'))$('#detailOverlay').classList.remove('open');else if($('#sidebar').classList.contains('mobile-open')){$('#sidebar').classList.remove('mobile-open');$('#drawerScrim').classList.remove('show')}}if(e.key==='Tab'){const o=$('.overlay.open');if(o){const f=[...o.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled])')];if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});
render();
})();
</script>
</body></html>
